---
apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: minio
  namespace: minio
spec:
  interval: 5m
  chart:
    spec:
      chart: minio
      version: 9.2.5
      sourceRef:
        kind: HelmRepository
        name: bitnami-charts
        namespace: flux-system
      interval: 5m
  values:
    auth:
      rootPassword: "password"
    ingress:
      enabled: true
      ingressClassName: "traefik"
      hostname: minio.home.jrbeverly.dev
      annotations:
        hajimari.io/appName: Minio
        hajimari.io/enable: "true"
        hajimari.io/icon: "view-dashboard"
        cert-manager.io/cluster-issuer: "letsencrypt-production"
        traefik.ingress.kubernetes.io/router.entrypoints: "websecure"
      hosts:
        - host: "minio.home.jrbeverly.dev"
          paths:
            - path: /
              pathType: Prefix
      tls:
        - hosts:
            - "minio.home.jrbeverly.dev"
          secretName: "minio-tls"
    apiIngress:
      enabled: true
      ingressClassName: "traefik"
      hostname: minio-api.home.jrbeverly.dev
      annotations:
        hajimari.io/enable: "true"
        hajimari.io/icon: "view-dashboard"
        cert-manager.io/cluster-issuer: "letsencrypt-production"
        traefik.ingress.kubernetes.io/router.entrypoints: "websecure"
      hosts:
        - host: "minio-api.home.jrbeverly.dev"
          paths:
            - path: /
              pathType: Prefix
      tls:
        - hosts:
            - "minio-api.home.jrbeverly.dev"
          secretName: "minio-api-tls"
