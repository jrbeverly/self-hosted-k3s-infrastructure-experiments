---
apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: docker-registry-ui
  namespace: container-registry-ui
spec:
  interval: 5m
  chart:
    spec:
      chart: docker-registry-ui
      version: 0.2.0
      sourceRef:
        kind: HelmRepository
        name: joxit-charts
        namespace: flux-system
      interval: 5m
  values:
    registry:
      enabled: false
    ui:
      title: "Docker Registry UI"
      proxy: true
      dockerRegistryUrl: https://registry.home.jrbeverly.dev
      replicaCount: 1
      ingress:
        enabled: false