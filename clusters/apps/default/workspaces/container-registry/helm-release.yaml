---
apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: docker-registry
  namespace: container-registry
spec:
  interval: 5m
  chart:
    spec:
      chart: docker-registry
      version: 1.10.1
      sourceRef:
        kind: HelmRepository
        name: twun-charts
        namespace: flux-system
      interval: 5m
  values:
    replicaCount: 1
    ingress:
      enabled: false
    persistence:
      enabled: true
      size: 60Gi
      deletedEnabled: true
      storageClass: docker-reigstry-local-storage
      existingClaim: docker-registry-pv-claim
    secrets:
      htpasswd: admin:$2y$05$Jv732j6Qzw9Ywi7dHQ05dOaNpM3iRZXBHBnW.PLHbVc6CcUsqn62m