---
apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: transmission
  namespace: transmission
spec:
  interval: 5m
  chart:
    spec:
      chart: transmission
      version: 8.3.2
      sourceRef:
        kind: HelmRepository
        name: k8s-at-home-charts
        namespace: flux-system
      interval: 5m
  values:
    ingress:
      main:
        enabled: true
        ingressClassName: "traefik"
        annotations:
          cert-manager.io/cluster-issuer: "letsencrypt-production"
          traefik.ingress.kubernetes.io/router.entrypoints: "websecure"
        hosts:
          - host: "download.home.jrbeverly.dev"
            paths:
              - path: /
                pathType: Prefix
        tls:
          - hosts:
              - "download.home.jrbeverly.dev"
            secretName: "transmission-tls"
    persistence:
      data:
        enabled: true
        existingClaim: transmission-config
    podAnnotations:
      configmap.reloader.stakater.com/reload: "transmission-settings"
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        memory: 256Mi
