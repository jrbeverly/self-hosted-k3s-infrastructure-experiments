---
apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: emby
  namespace: emby
spec:
  interval: 5m
  chart:
    spec:
      chart: emby
      version: 3.0.0
      sourceRef:
        kind: HelmRepository
        name: k8s-at-home-charts
        namespace: flux-system
      interval: 5m
  values:
    image:
      repository: ghcr.io/k8s-at-home/emby
      tag: v4.6.1.0
    ingress:
      main:
        enabled: true
        ingressClassName: "traefik"
        annotations:
          cert-manager.io/cluster-issuer: "letsencrypt-production"
          traefik.ingress.kubernetes.io/router.entrypoints: "websecure"
        hosts:
          - host: "watch.home.jrbeverly.dev"
            paths:
              - path: /
                pathType: Prefix
        tls:
          - hosts:
              - "watch.home.jrbeverly.dev"
            secretName: "emby-tls"
    persistence:
      data:
        enabled: true
        existingClaim: emby-config
    podAnnotations:
      configmap.reloader.stakater.com/reload: "emby-settings"
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        memory: 256Mi
